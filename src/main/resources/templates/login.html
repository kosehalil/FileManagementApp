<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>Login-FileApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<section>

  <div class="container mt-5 p-5">
    <div class="row">
      <div class="col-md-6 p-5">
        <img alt="" src="resimler/file3.png" width="100%" height="400px">
      </div>
      <div class="col-md-6 mt-3 p-5">
        <div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
          <div class="card-header">
            <p class="fs-4 text-center">Giriş Yap</p>
          </div>
          <div class="card-body">
            <form action="/login" method="post">
              <div class="mb-3">
                <label class="form-label">E-mail</label> <input required
                                                                class="form-control" name="username" type="email">
              </div>

              <div class="mb-3">
                <label class="form-label">Şifre</label> <input required
                                                               class="form-control" name="password" type="password">
              </div>
              <button type="submit"
                      class="btn bg-primary text-white col-md-12">Giriş Yap</button>
            </form>
          </div>

          <div class="card-footer text-center">

            Bir hesabın yok mu? <a href="/register" class="text-decoration-none";>Hesap Oluştur</a>
          </div>
        </div>
      </div>
    </div>
  </div>

</section>

<h1 class="text-center mt-3">Demo Sayfası</h1>

</body>
</html>
