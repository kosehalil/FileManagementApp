
<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>Register-FileApp</title>
</head>

<body>
<section>

  <div class="container mt-5 p-5">
    <div class="row">
      <div class="col-md-5 p-4">
        <img alt="" src="resimler/file3.png" width="100%" height="400px">
      </div>
      <div class="col-md-7 p-2">
        <div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
          <div class="card-header text-center">
            <p class="fs-4 text-center">Kayıt Ol</p>

          </div>
          <div class="card-body">
            <form action="/saveUser" enctype="multipart/form-data" id="userRegister" novalidate
                  method="post">
              <div class="row">
                <div class="col">
                  <label class="form-label">İsim</label> <input required
                                                                        class="form-control" name="username" type="text">
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Soyad</label> <input required
                                                                class="form-control" name="lastname" type="text">
              </div>

              <div class="mb-3">
                <label class="form-label">E-mail</label> <input required
                                                                class="form-control" name="email" type="email">
              </div>
              <div class="row mb-2">
                <div class="col">
                  <label class="form-label">Şifre</label> <input required
                                                                 class="form-control" name="password" type="password" id="pass">
                </div>


              </div>

              <button type="submit"
                      class="btn bg-primary text-white col-md-12">Kayıt Ol</button>
            </form>
          </div>

          <div class="card-footer text-center">

            Hesaba Sahip Misin? <a href="/login" class="text-decoration-none">Giriş Yap
          </a>
          </div>
        </div>
      </div>
    </div>
  </div>

</section>
</body>
</html>
