<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>User List -FileApp</title>
</head>
<body>
<section>
    <div class="container mt-5 p-5">
        <div class="card card-sh">
            <div class="card-header text-center">
                <p class="fs-4">Sistemi Kullanan Kullanıcılar</p>

                <th:block th:if="${session.successMessage}">
                    <p class="text-success fw-bold">[[${session.successMessage}]]</p>
                    <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                </th:block>

                <th:block th:if="${session.errorMessage}">
                    <p class="text-danger fw-bold">[[${session.errorMessage}]]</p>
                    <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                </th:block>
            </div>

            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Ad</th>
                        <th scope="col">Soyad</th>
                        <th scope="col">Email</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u, iterStat : ${users}">
                        <th scope="row" th:text="${iterStat.count}">1</th>
                        <td th:text="${u.username}">Ad</td>
                        <td th:text="${u.lastname}">Soyad</td>
                        <td th:text="${u.email}">email@example.com</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</body>
</html>
