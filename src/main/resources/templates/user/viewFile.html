<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>View File-FileApp</title>
</head>
<body>
<section>
    <div class="container mt-5 p-5">
        <div class="card card-sh">
            <div class="card-header text-center">
                <p class="fs-4">Yüklenen Dosyalar</p>

                <th:block th:if="${session.successMessage}">
                    <p class="text-success fw-bold">[[${session.successMessage}]]</p>
                    <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                </th:block>

                <th:block th:if="${session.errorMessage}">
                    <p class="text-danger fw-bold">[[${session.errorMessage}]]</p>
                    <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                </th:block>
            </div>

            <div class="card-body">
                <table class="table">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Dosya Adı</th>
                        <th>Açıklama</th>
                        <th>Görüntüle</th>
                        <th>Sil</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="f, iterStat : ${files}">
                        <td th:text="${iterStat.count}"></td>
                        <td th:text="${f.title}"></td>
                        <td th:text="${f.description}"></td>
                        <td>
                            <a th:href="@{'/resimler/' + ${f.fileName}}" target="_blank" class="btn btn-sm btn-success">İncele</a>
                        </td>
                        <td>
                            <a th:href="@{'/user/deleteFile/' + ${f.id}}" class="btn btn-sm btn-danger">Sil</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</body>
</html>
