<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>Menu-FileApp</title>
</head>
<body>
<section>

  <div id="carouselExample" class="carousel slide">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="/resimler/base2.png" class="d-block w-100" alt="..." height="420px">
      </div>
      <div class="carousel-item">
        <img src="/resimler/base3.png" class="d-block w-100" alt="..." height="420px">
      </div>
      <div class="carousel-item">
        <img src="/resimler/base1.png" class="d-block w-100" alt="..." height="420px">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <div class="container p-5" style="margin-bottom: 140px;">
    <p class="text-center fs-3 mt-4">Dosya Yönetim Paneli</p>
    <div class="row p-5">
      <div class="col-md-4 mt-4">
        <a href="/user/uploadFile" class="text-decoration-none">
          <div class="card card-sh">
            <div class="card-body text-center" style="color: green;">
              <i class="fa-solid fa-square-plus fa-3x"></i>
              <h4>Dosya Yükle</h4>
            </div>
          </div>
        </a>
      </div>

      <div class="col-md-4 mt-4">
        <a href="/user/viewFile" class="text-decoration-none">
          <div class="card card-sh">
            <div class="card-body text-center" style="color: red;">
              <i class="fa-solid fa-rectangle-list fa-3x"></i>
              <h4>Dosyaları İncele</h4>
            </div>
          </div>
        </a>
      </div>


      <div class="col-md-4 mt-4">
        <a href="/user/userList" class="text-decoration-none">
          <div class="card card-sh">
            <div class="card-body text-center " style="color: darkorchid;">
              <i class="fa-solid fa-circle-user fa-3x"></i>
              <h4>Kullanıcılar</h4>
            </div>
          </div>
        </a>
      </div>

    </div>
  </div>
</section>
</body>
</html>
